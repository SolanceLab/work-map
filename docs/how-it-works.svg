<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 560" width="1020" height="560" role="img" aria-labelledby="t d">
  <title id="t">How work-map works</title>
  <desc id="d">Your work is spread across many folders: one decisions file, a task list and a map of projects at the top, and in every project folder its own pipeline, its devlog and its specs. Each record is one plain line. work-map reads them all and ties the lines together across folders. Asked why the bot retries three times, it hands back the chain: the release that shipped it, the pipeline item it was done by with its spec, the decision it rested on, and the same decision still open for another project.</desc>
