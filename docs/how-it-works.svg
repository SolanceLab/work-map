    @media (prefers-color-scheme: dark){ .folder{fill:#e6edf3}.rowpick{fill:#2e2a0e}.link{fill:#d29922}.ptr{stroke:#6e7681}.tvault{fill:#f0883e}.tmuted{fill:#9198a1} }
